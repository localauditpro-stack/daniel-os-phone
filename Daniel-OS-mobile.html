<title>Daniel OS</title>
<style>
  :root{--bg:#151513;--surf:#1d1d1b;--tx:#e8e6e1;--tx2:#9c9a92;--bd:#31312c;--acc:#82abe8;--dgr:#e59b94}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #gate{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
  .box{width:100%;max-width:320px}
  .lock{font-size:40px;margin-bottom:12px}
  h1{font-size:18px;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--tx2);font-size:13px;margin:0 0 22px}
  input[type=password]{width:100%;box-sizing:border-box;padding:13px 14px;font-size:16px;border-radius:10px;
    border:1px solid var(--bd);background:var(--surf);color:var(--tx);text-align:center;outline:none}
  input[type=password]:focus{border-color:var(--acc)}
  button.go{width:100%;margin-top:10px;padding:13px;font-size:15px;font-weight:650;border:none;border-radius:10px;
    background:var(--acc);color:#0b1220;cursor:pointer}
  button.go:disabled{opacity:.5}
  .remember{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;
    color:var(--tx2);font-size:13px;cursor:pointer;user-select:none}
  .remember input{width:16px;height:16px;accent-color:var(--acc);cursor:pointer}
  .err{color:var(--dgr);font-size:13px;min-height:18px;margin-top:10px}
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
</style></head>

    <label class="remember"><input id="remember" type="checkbox" checked> Keep me signed in for 30 days</label>
    <div class="err" id="err"></div>
  </form>
</div></div>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const LS_KEY="dos_pw30", SS_KEY="dos_pw";

/* Phone-only layout fixes, injected ONLY into this page's rendered copy of the
   dashboard. The source Daniel-OS.html on the desktop is never modified. */
const MOBILE_CSS = `<style id="dos-mobile-fix">
@media (max-width:600px){
  html,body{overflow-x:hidden;max-width:100%;}
  /* Do-next rows: stack vertically instead of one wide non-wrapping row */
  .dnrow{flex-direction:column;align-items:stretch;gap:8px;}
  .dnrow .dnproj{white-space:normal;}
  .dnrow .dnact{min-width:0;flex:none;}
  .dnrow .dnbtns{margin-left:0;}
  /* tap-friendlier action buttons */
  .dnbtn{padding:8px 13px;font-size:13px;}
  /* safety: keep wide media/blocks inside the screen */
  img,pre,canvas{max-width:100%;}
  .rt{max-width:100%;}
}
</style>`;

async function decrypt(pw){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey("raw",enc.encode(pw),{name:"PBKDF2"},false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:b64(ENC.salt),iterations:ENC.iter,hash:"SHA-256"},
    km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.iv)},key,b64(ENC.ct));
  return new TextDecoder().decode(pt);
}
function reveal(html){
  html = html.replace(/<\/head>/i, MOBILE_CSS + "</head>");
  const f=$("frame"); f.srcdoc=html; $("gate").style.display="none"; f.style.display="block";
}
function remember30(pw){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({pw, exp: Date.now()+30*864e5})); }catch(_){}
}
function forget30(){ try{ localStorage.removeItem(LS_KEY); }catch(_){} }
function stored30(){
  try{
    const raw=localStorage.getItem(LS_KEY); if(!raw) return null;
    const o=JSON.parse(raw);
    if(!o || !o.pw || !o.exp || Date.now()>o.exp){ forget30(); return null; }
    return o.pw;
  }catch(_){ return null; }
}
async function tryUnlock(pw,{persist,remember}={}){
